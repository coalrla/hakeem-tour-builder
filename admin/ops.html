<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tour Operations · Hakeem Travel Korea</title>
<link rel="icon" href="../favicon.png">
<style>
@font-face { font-family: "SUIT Variable"; font-weight: 100 900; font-display: swap; src: url(../fonts/suit-latin.woff2) format("woff2-variations"); }
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-display: swap; src: url(../fonts/pretendard-ko.woff2) format("woff2-variations"); }
/* 투어 운영 체크: 상단 요약 → Confirmed 투어 목록(예약 현황 한눈에) → 선택한 투어의 운영 상세(예약·인보이스·가이드 비용).
   데이터는 견적 요청 서버(admin과 같은 서버·같은 직원 로그인)에서 읽고 쓴다. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --line:#dce3e1; --text:#14243b; --muted:#5f6b7a;
  --accent:#5b3d91; --accent-soft:#efe9f8;
  --prev:#a3b3c0; --ok:#1d7a4b; --ok-bg:#dff3e7; --warn:#a85a00; --warn-bg:#fdebd0; --bad:#b3261e; --bad-bg:#fbe0dd; --info:#2457a6; --info-bg:#dde8fa; --na:#6b7785; --na-bg:#e9edf1;
  --font:"SUIT Variable","Pretendard Variable","Segoe UI","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12181e; --surface:#1a222b; --line:#2e3944; --text:#e6ecf1; --muted:#9aa8b6;
    --accent:#b79cf0; --accent-soft:#2b2140;
    --prev:#5f7383; --ok:#6fd09a; --ok-bg:#1b3a2a; --warn:#f0b05c; --warn-bg:#40300f; --bad:#ff9b92; --bad-bg:#44201d; --info:#8db4f2; --info-bg:#1d3150; --na:#93a1af; --na-bg:#25303b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12181e; --surface:#1a222b; --line:#2e3944; --text:#e6ecf1; --muted:#9aa8b6;
  --accent:#b79cf0; --accent-soft:#2b2140;
  --prev:#5f7383; --ok:#6fd09a; --ok-bg:#1b3a2a; --warn:#f0b05c; --warn-bg:#40300f; --bad:#ff9b92; --bad-bg:#44201d; --info:#8db4f2; --info-bg:#1d3150; --na:#93a1af; --na-bg:#25303b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0}
a{color:var(--accent)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:8px;font-weight:500;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1a20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1a20}}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 10px;font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#savemsg{font-size:12.5px;color:var(--muted)}
#savemsg.err{color:var(--bad);font-weight:700}
#gate{display:none}
#gate .body{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card>header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.card .body{padding:14px}
.note{color:var(--muted);font-size:12.5px}

.dash{display:flex;flex-direction:column;gap:8px}
.kpis{display:flex;flex-wrap:wrap;gap:4px 26px;align-items:baseline}
.kpis .big{font-size:22px;font-weight:700}
.kpis .lab{color:var(--muted);font-size:12.5px;display:block}
.up{color:var(--ok);font-weight:700}
.down{color:var(--bad);font-weight:700}
table.mt th,table.mt td{font-size:12px;padding:2px 8px;text-align:right;white-space:nowrap}
table.mt th:first-child,table.mt td:first-child{text-align:left;color:var(--muted);position:sticky;left:0;background:var(--surface)}
.tt td{vertical-align:top;white-space:normal;min-width:150px}
.tt tbody tr{cursor:pointer}
.tt tbody tr:hover{background:var(--accent-soft)}
.dd{font-weight:700;min-width:48px}
.dd.soon{color:var(--bad)}
.ln{display:flex;gap:6px;align-items:baseline;font-size:12.5px;line-height:1.55}
.ln.done{color:var(--muted)}
.mini{display:inline-block;flex:none;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px}
.row7{display:grid;grid-template-columns:1.6fr 1fr .9fr 1fr .6fr 1.1fr 1.1fr;gap:10px 12px}
.row7 label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
@media (max-width:1100px){.row7{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
.cmp>header{padding:6px 14px}
.cmp .kpis .big{font-size:18px;line-height:1.25}
.cmp .kpis{gap:2px 22px;align-items:flex-end}
.cmp h2{align-self:center}
.cmp .kpis.ctr{flex:1;justify-content:center;align-items:center;gap:4px 28px}
.kpis.ctr>span{text-align:center}
.cmp .kpis.ctr .big{font-size:19.8px}
.kpis.ctr .lab,.kpis.ctr .note{font-size:13.75px}
.t110{font-size:16.5px}
.kpis.one{flex-wrap:nowrap;align-items:baseline;gap:2px 16px}
.kpi1{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.kpi1 .lab{display:inline;font-size:12px}
table.mt tr.prev td{color:var(--muted)}
.ul th,.ul td{padding:2px 12px}
.ul td.r,.ul th.r{text-align:right}
.ul tbody tr{cursor:pointer}
.ul tbody tr:hover{background:var(--accent-soft)}
.grp{font-size:17px;font-weight:700;margin:2px 0 0;padding-left:10px;border-left:4px solid var(--accent);line-height:1.3}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:820px){.pair{grid-template-columns:minmax(0,1fr)}}
.ct td:first-child{color:var(--text)}
.ct td.open b{color:var(--warn)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.lab{font-weight:500;white-space:nowrap}
select.st.s-need{background:var(--bad-bg);color:var(--bad)}
select.st.s-prog{background:var(--warn-bg);color:var(--warn)}
select.st.s-done{background:var(--ok-bg);color:var(--ok)}
select.st.s-cancel{background:var(--na-bg);color:var(--muted);text-decoration:line-through}
select.st.s-na{background:var(--na-bg);color:var(--na)}
#detail td[id^="hn-"],#detail td[id^="gd-"],#detail td[id^="gdays-"]{white-space:nowrap}
.list tbody tr{cursor:pointer}
.list tbody tr:hover{background:var(--accent-soft)}
.list tbody tr.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.list td{white-space:nowrap}
.list .two{display:flex;flex-direction:column;line-height:1.35}
.list .two small{color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}

.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.c-need,.s-need{background:var(--bad-bg);color:var(--bad)}
.c-prog,.s-prog{background:var(--warn-bg);color:var(--warn)}
.c-info,.s-info{background:var(--info-bg);color:var(--info)}
.c-done,.s-done{background:var(--ok-bg);color:var(--ok)}
.c-cancel,.s-cancel{background:var(--na-bg);color:var(--muted);text-decoration:line-through}
.c-na,.s-na{background:var(--na-bg);color:var(--na)}

input.f,select.f,textarea.f,select.st{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;min-width:0}
input.f:hover,select.f:hover,textarea.f:hover{border-color:var(--accent)}
input.f[readonly],textarea.f[readonly]{background:var(--bg);color:var(--muted);cursor:default}
input.f[readonly]:hover,textarea.f[readonly]:hover{border-color:var(--line)}
input.f.num{text-align:right}
select.st{width:auto;min-width:104px;border-radius:999px;font-weight:700;font-size:12.5px;padding:3px 8px;border-color:transparent;cursor:pointer}
textarea.f{min-height:70px;resize:vertical}
td input.f{min-width:90px}
td input.f.date{min-width:132px}
td input.f.w-sm{min-width:70px;width:84px}

.dhead-card{position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.dhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.dhead .id{font-size:12.5px;color:var(--muted)}
.dhead .name{font-size:19px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.bar{width:150px;height:8px;border-radius:99px;background:var(--na-bg);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.grid label.wide{grid-column:1/-1}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.strip span.item{display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px}
.sections{display:flex;flex-direction:column;gap:14px}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.sumrow{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;margin-top:10px}
.sumrow b{font-size:18px}
.warn{color:var(--warn)}
.bad{color:var(--bad)}
.x{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-bg)}
@media (max-width:600px){.two-col{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <a href="./index.html" style="font-size:13px;text-decoration:none">← 투어 빌더 (admin)로 돌아가기</a>
      <h1 style="margin-top:4px">투어 운영 체크</h1>
      <div class="sub">Confirmed로 바꾼 견적 요청이 자동으로 들어옵니다. 예약 현황, 인보이스(USD·KRW), 가이드 비용 입력칸을 한 곳에서 봅니다. 입력한 내용은 서버에 자동 저장됩니다.</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span id="savemsg" role="status" aria-live="polite"></span>
      <button class="btn" id="btn-reload" type="button">새로고침</button>
      <a class="btn primary" href="./index.html">← 투어 빌더 (admin)</a>
    </div>
  </div>

  <section class="card" id="gate">
    <header><h2>직원 로그인이 필요합니다</h2></header>
    <div class="body">
      <div id="gate-msg" class="note"></div>
      <a class="btn primary" href="./index.html">admin에서 로그인하기</a>
      <div class="note">admin에서 로그인한 뒤 이 페이지로 돌아와 새로고침하면 같은 로그인이 그대로 쓰입니다.</div>
    </div>
  </section>

  <section class="dash" id="dash" aria-label="대시보드"></section>

  <section class="card" id="listcard">
    <header>
      <h2>투어 목록</h2>
      <span class="note" id="listnote"></span>
    </header>
    <div class="scroll"><table class="list" id="list"></table></div>
  </section>

  <div id="detail" class="sections"></div>
</div>

<script>
const ST=['해당 없음','예약 필요','예약 중','예약 완료','예약 취소'];
const STCLS={'해당 없음':'na','예약 필요':'need','예약 중':'prog','예약 완료':'done','예약 취소':'cancel'};
const CATS=[['vehicle','차량'],['hotels','숙소'],['ktx','KTX'],['guides','투어 가이드'],['flights','국내 항공']];
const VTYPES=['공항 픽업','공항 드롭','서울역 픽업','서울역 드롭','부산역 픽업','부산역 드롭','서울 전일투어','부산 전일투어','제주도 전일투어','도시 간 이동','기타'];
const SMBS='http://www.smbs.biz/ExRate/TodayExRate.jsp';
const ST_MAP={todo:'예약 필요',req:'예약 중',ok:'예약 완료',na:'해당 없음'};  /* 수배 탭 상태 → 운영 체크 상태 (처음 가져올 때만) */
const CITY_KO={seoul:'서울',jeju:'제주',busan:'부산'};

/* ---------- 차량: 수배 탭의 "일자별 차량 일정"을 그대로 펼쳐서 가져오기 ----------
   수배 목록(ops)은 차량을 도시별 한 줄로만 저장하므로, 요청 상세(itinerary)에서 일자별 일정을 다시 계산합니다.
   계산 규칙은 admin/index.html 의 vehicleSchedule 과 같습니다. */
const CITY=CITY_KO;
const T_KO={ICN:'인천공항',GMP:'김포공항',SEL_STN:'서울역',PUS:'김해공항',BUS_STN:'부산역',CJU:'제주공항'};
const T_CITY={ICN:'seoul',GMP:'seoul',SEL_STN:'seoul',PUS:'busan',BUS_STN:'busan',CJU:'jeju'};
const VEH_KO={staria:'스타리아',solati:'솔라티',bus:'대형버스'};
const PLACE_KO={Seoul:'서울',Busan:'부산',Jeju:'제주',Gyeongju:'경주',Suwon:'수원',Gapyeong:'가평',Goyang:'고양',Hwacheon:'화천',Chuncheon:'춘천',DMZ:'DMZ',Gimpo:'김포',Yongin:'용인',Gyeonggi:'경기',Incheon:'인천',Gimhae:'김해'};
const OLD_PLAN={drv:['staria','staria',0],sol:['solati','solati',1],mix:['solati','bus',1],bus:['bus','bus',0]};
function planOf(r){
  if(r.options.plan)return r.options.plan;
  const p=r.options.pax,c=r.options.cls||(p<=4?'drv':p<=9?'sol':p<=13?'mix':'bus'),x=OLD_PLAN[c]||OLD_PLAN.bus;
  return{pickup:x[0],tour:x[1],luggage:!!x[2]};
}
const isMix=r=>r.options.vehicle==='Standard'&&planOf(r).pickup!==planOf(r).tour;
const hasLuggage=r=>planOf(r).luggage;
const tripKo=d=>{const p=String(d.route||'').split('→').map(x=>x.trim()).filter(Boolean),mid=p.slice(1,-1).flatMap(x=>x.split('·').map(y=>y.trim()));return mid.length?' · '+mid.map(x=>PLACE_KO[x]||x).join('·'):''};
const cityOfDay=d=>d.kind==='tour'&&d.region?d.region:/Busan|Gyeongju|Haeundae|Gamcheon|Spa Day/.test(d.title+d.route)?'busan':/Jeju|Sunrise Peak|Waterfalls|Alpacas|Markets & Café|Beaches & Volcanic/.test(d.title+d.route)?'jeju':'seoul';
function vehicleSchedule(r){
  const out=[],mix=isMix(r),lugOn=hasLuggage(r),last=r.itinerary.length-1;
  const v=(i,text,type,free,city)=>out.push({day:i+1,date:r.trip.arrival?addDays(r.trip.arrival,i):'',text,type,free:!!free,city:city||(/제주/.test(text)?'jeju':/부산|김해/.test(text)?'busan':'seoul')});
  const pl=planOf(r),tourBus=mix?` · ${VEH_KO[pl.tour]}`:'',trVeh=mix?` · ${VEH_KO[pl.pickup]}`:'';
  r.itinerary.forEach((d,i)=>{
    if(d.kind==='tour')return v(i,`${CITY[cityOfDay(d)]} 투어 종일${tripKo(d)}${tourBus}`,'tour',false,cityOfDay(d));
    if(d.kind!=='transfer')return;
    if(!Array.isArray(d.transfers))return oldTransfers(r,d,i,v,lugOn);
    const paid=Array.isArray(d.paid)?d.paid:d.transfers,adds=d.adds||[];
    const half=()=>{if(adds.length)v(i,`이동일 관광${d.tourCity?` (${CITY[d.tourCity]})`:''}${tourBus}`,'half',false,d.tourCity||cityOfDay(d))};
    if(adds.length&&d.tourCity&&d.tourCity===d.from)half();
    d.transfers.forEach((t,k)=>{
      const c=CITY[T_CITY[t]]||'',free=!paid.includes(t);
      let text,city=T_CITY[t];
      if(i===0)text=`${T_KO[t]} 도착 픽업 → ${c} 호텔`;
      else if(i===last)text=t==='ICN'&&k>0?`${T_KO[{CJU:'GMP',BUS_STN:'SEL_STN',PUS:'GMP'}[d.transfers[k-1]]]||'김포공항'} 픽업 → 인천공항 샌딩`:`${c} 호텔 → ${T_KO[t]} 샌딩`;
      else{text=k===0?`${CITY[d.from]||c} 호텔 → ${T_KO[t]} 샌딩`:`${T_KO[t]} 픽업 → ${CITY[d.to]||c} 호텔`;city=(k===0?d.from:d.to)||city}
      const lug=lugOn&&((i===0&&k===0)||(i===last&&k===d.transfers.length-1))?' + 짐차':'';
      v(i,text+(free?' (이동일 관광 차량이 진행 · 별도 요금 없음)':trVeh+lug),'transfer',free,city);
    });
    if(adds.length&&!(d.tourCity&&d.tourCity===d.from))half();
  });
  return out;
}
function oldTransfers(r,d,i,v,lugOn){
  const t=d.title,lug=lugOn?' + 짐차':'';
  if((d.adds||[]).length)v(i,'이동일 관광','half',false,cityOfDay(d));
  if(/Arrival/.test(t))v(i,`인천공항 도착 픽업 → 서울 호텔${lug}`,'transfer');
  if(/Seoul to Jeju/.test(t)){v(i,'서울 호텔 → 김포공항 샌딩','transfer');v(i,'제주공항 픽업 → 제주 호텔','transfer')}
  if(/Jeju to Busan/.test(t)){v(i,'제주 호텔 → 제주공항 샌딩','transfer');v(i,'김해공항 픽업 → 부산 호텔','transfer')}
  if(/Seoul to Busan/.test(t)){v(i,'서울 호텔 → 서울역 샌딩','transfer');v(i,'부산역 픽업 → 부산 호텔','transfer')}
  if(/Departure/.test(t)){
    if(/Jeju/.test(d.route)){v(i,'제주 호텔 → 제주공항 샌딩','transfer');v(i,`김포공항 픽업 → 인천공항 샌딩${lug}`,'transfer')}
    else if(/Busan/.test(d.route)){v(i,'부산 호텔 → 부산역 샌딩','transfer');v(i,`서울역 픽업 → 인천공항 샌딩${lug}`,'transfer')}
    else v(i,`서울 호텔 → 인천공항 샌딩${lug}`,'transfer');
  }
}
/* 표의 "구분" 칸에 들어갈 짧은 이름 (예: 인천공항 픽업, 서울 전일투어, 서울역 드롭) */
function vehLabel(t,c){
  t=String(t||'');const cn=CITY_KO[c]||'';
  if(/투어 종일/.test(t))return cn+' 전일투어';
  if(/이동일 관광/.test(t))return cn+' 이동일 관광';
  let m=t.match(/^(\S+?) 도착 픽업/);if(m)return m[1]+' 픽업';
  m=t.match(/^(\S+?) 픽업 →/);if(m)return m[1]+' 픽업';
  m=t.match(/→ (\S+?) 샌딩/);if(m)return m[1]+' 드롭';
  return t.length>16?t.slice(0,16)+'…':(t||'차량');
}
const msOf=s=>ST_MAP[s]||'예약 필요';
/* 차량 한 줄 = 차량 1대(하루). 도시별 업체·상태는 수배 탭의 차량 줄에서 가져와 그 도시의 모든 일자에 적용합니다. */
function vehicleRowsRaw(r,D,ms){
  const ops=(r.ops||[]).filter(x=>x.cat==='vehicle'),arr=r.arrival||(D&&D.trip&&D.trip.arrival)||'';
  const oldStyle=()=>ops.map(x=>({type:x.item||'차량',date:x.date||arr,vendor:x.vendor||'',note:x.detail||'',status:ms(x.status)}));
  let sched=[];
  if(D&&D.itinerary&&D.trip&&D.options){try{sched=vehicleSchedule(D)}catch(e){sched=[]}}
  const cities=[...new Set([...sched.map(x=>x.city),...ops.map(o=>o.city).filter(Boolean)])];
  if(!cities.length)return oldStyle();
  const rows=[];
  cities.forEach(c=>{
    const o=ops.find(x=>x.city===c)||(ops.length===1&&!ops[0].city?ops[0]:null);
    const lines=o&&Array.isArray(o.plan)?o.plan.map(x=>({day:x.day,date:arr?addDays(arr,x.day-1):'',text:x.text,free:false})):sched.filter(x=>x.city===c);
    if(!lines.length&&o){rows.push({type:o.item||'차량',date:o.date||arr,vendor:o.vendor||'',note:o.detail||'',status:ms(o.status),_c:c,_d:0});return}
    lines.forEach(x=>rows.push({type:vehLabel(x.text,c),date:x.date||'',vendor:o?(o.vendor||''):'',note:x.text,status:x.free?'해당 없음':(o?ms(o.status):'예약 필요'),_c:c,_d:x.day||0}));
  });
  rows.sort((a,b)=>(a.date||'9').localeCompare(b.date||'9')||(a._d||0)-(b._d||0));
  return rows;
}
const vehicleRows=(r,D,ms)=>vehicleRowsRaw(r,D,ms).map(x=>{const y={...x};delete y._c;delete y._d;return y});

function summarize(list){
  const a=list.filter(x=>x.status!=='해당 없음');

function progress(t){

  CATS.forEach(([k])=>t[k].forEach(x=>{if(x.status==='해당 없음'||x.status==='예약 취소')return;live++;if(x.status==='예약 완료')done++}));
  return live?Math.round(done/live*100):0;
}

function invTotal(t){return (t.invoice.items||[]).reduce((s,i)=>s+(num(i.usd)||0),0)}

function prefill(r,D){
  const ops=r.ops||[],pax=r.pax,ms=s=>ST_MAP[s]||'예약 필요';
  const vehicle=vehicleRows(r,D,ms);
  const guides=ops.filter(x=>x.cat==='guide').map(x=>{const m=String(x.detail||'').match(/(\d+)일/),n=m?+m[1]:0;
    return{name:x.vendor||'',city:x.item||'',from:x.date||'',to:x.date&&n?addDays(x.date,n-1):(x.date||''),status:ms(x.status),fee:'',feeDate:'',cash:'',memo:''}});
  const tr=ops.filter(x=>x.cat==='transport');
  const ktx=tr.filter(x=>/^KTX/i.test(x.item)).map(x=>({date:x.date||'',route:String(x.item).replace(/^KTX\s*/i,''),time:'',seats:pax?pax+'석':'',conf:x.ref||'',status:ms(x.status)}));
  const flights=tr.filter(x=>!/^KTX/i.test(x.item)).map(x=>({date:x.date||'',route:x.item||'',flight:'',conf:x.ref||'',status:ms(x.status)}));
  const hotels=(r.hotels||[]).map(h=>{const o=ops.find(x=>x.cat==='hotel'&&h.name&&String(x.item).includes(h.name));
    return{city:CITY_KO[h.city]||h.city||'',hotel:h.name||'',checkin:h.checkIn||'',checkout:h.checkOut||'',conf:o?(o.ref||''):'',fc:'',status:o?ms(o.status):'예약 필요'}});
  return{vehicle,hotels,ktx,flights,guides};
}

    /* 이미 저장된 운영 체크: 예전 방식(도시별 한 줄)으로 가져온 차량 줄만 일자별 줄로 바꾸고, 직접 입력한 줄은 그대로 둡니다. */

    <header><h2>가이드 비용</h2><span class="note">입력칸만 있는 상태입니다. 추후 정산서에서 업데이트될 예정입니다.</span></header>
    <div class="body">
      ${tbl(['가이드','일수','일비 지급액 (KRW)','일비 지급일','현금 사용분 및 기타(차량 등) 지급 (KRW)','내용 메모'],cost,'위 "투어 가이드"에 가이드를 추가하면 비용 입력 행이 생깁니다.')}
      <div class="grid" style="margin-top:12px;max-width:520px">
        <label>정산서 상태${sel('settle.status',t.settle.status,['미작성','작성중','작성 완료'],'정산서 상태')}</label>
        <label>정산서 번호 / 링크${inp('settle.ref',t.settle.ref,{ph:'정산서 연결 예정'})}</label>
      </div>
    </div>
  </section>`;
  updateDerived();
}

function updateDerived(){
  const t=cur();if(!t)return;
  const $=id=>document.getElementById(id);
  const set=(id,h)=>{const e=$(id);if(e)e.innerHTML=h};
  set('d-id',esc(t.id)+(t.buyerCode?' · '+esc(t.buyerCode):'')+(t.assignee?' · 담당 '+esc(t.assignee):''));
  set('d-name',esc(t.agent||'(업체 미입력)')+(t.contact?` <span class="note" style="font-weight:400">(${esc(t.contact)})</span>`:''));
  const n=diff(t.start,t.end);
  set('d-period',t.start&&t.end&&n!=null&&n>=0?`${n}박 ${n+1}일 · ${md(t.start)} – ${md(t.end)} · <b>${dday(t.start)}</b>`:'<span class="note">일정 미입력</span>');
  const pc=progress(t);const bar=$('d-bar');if(bar)bar.style.width=pc+'%';set('d-pct',`예약 ${pc}%`);
  set('d-strip',CATS.map(([k,lab])=>{const r=summarize(t[k]);return `<span class="item">${lab} ${chip(r.k,r.txt)}</span>`}).join(''));
  set('d-edited',t.saved?`마지막 저장: ${esc(t.editedBy||'')} ${t.editedAt?new Date(t.editedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}`:'아직 저장된 운영 입력이 없습니다. 수배 탭의 내용으로 미리 채워져 있으며, 아래에서 무엇이든 고치면 저장됩니다.');
  CATS.forEach(([k])=>{const r=summarize(t[k]);set('sum-'+k,chip(r.k,r.txt))});
  t.hotels.forEach((h,i)=>{
    const nn=diff(h.checkin,h.checkout);set('hn-'+i,nn!=null&&nn>=0?nn+'박':'');
    const fc=num(h.fc);
    if(fc!=null&&h.checkin){const dl=addDays(h.checkin,-fc);const left=diff(today(),dl);
      set('hc-'+i,left<0?`<span class="bad">기한 지남 (${md(dl)})</span>`:`~${md(dl)} (${dday(dl)})`)}
    else set('hc-'+i,'');
  });
  t.guides.forEach((g,i)=>{
    const dn=diff(g.from,g.to);const days=dn!=null&&dn>=0?dn+1:null;
    set('gd-'+i,days?days+'일':'');set('gdays-'+i,days?days+'일':'');
    set('gn-'+i,esc(g.name||'(가이드 미입력)')+(g.city?` <span class="note">${esc(g.city)}</span>`:''));
  });
  if(t.invoice.no){
    const tot=invTotal(t),krw=invKRW(t),got=num(t.invoice.collected)||0,bal=Math.max(0,tot-got),r=num(t.invoice.rate);
    set('inv-usd',fmtUSD(tot));set('inv-krw',krw?fmtKRW(krw):'—');
    set('inv-bal',fmtUSD(bal));set('inv-bal-krw',r?fmtKRW(bal*r):'');
    const col=invCollect(t);set('inv-st',chip(col.k,col.txt));
    const rf=rateFor(t.invoice.date);
    let note='';
    if(!t.invoice.date)note='발행일이 없어 저장된 환율을 찾을 수 없습니다.';
    else if(!rf)note='<span class="warn">이 날짜의 환율이 없습니다. 위 링크에서 확인해 입력하세요.</span>';
    else if(rf.exact&&num(t.invoice.rate)===rf.rate)note=`${rf.from} 저장값 사용 중`;
    else if(!rf.exact&&num(t.invoice.rate)===rf.rate)note=`<span class="warn">${rf.from} 환율을 임시 적용 중. 발행일 환율을 확인하세요.</span>`;
    else note='입력한 값이 이 발행일의 환율로 저장됩니다.';
    set('rate-note',note);
  }
}
function refresh(){renderDash();renderList();updateDerived()}

/* ---------- 이벤트 ---------- */
const detail=document.getElementById('detail');
function onEdit(e){
  const el=e.target;
  if(el.id==='vadd'){if(el.value){addRow('vehicle',el.value);el.value=''}return}
  const path=el.dataset&&el.dataset.path;if(!path)return;
  const t=cur();if(!t)return;
  let v=el.value;
  if(el.dataset.num)v=num(v);
  if(el.dataset.st)el.className='st s-'+STCLS[v];
  setP(t,path,v);
  if(path==='invoice.rate'&&t.invoice.date&&num(v)!=null)state.rates[t.invoice.date]=num(v);
  persist();refresh();
}
detail.addEventListener('input',onEdit);
detail.addEventListener('change',onEdit);

function addRow(k,arg){
  const t=cur();if(!t)return;
  if(k==='hotels'){const last=t.hotels[t.hotels.length-1];t.hotels.push({city:'',hotel:'',checkin:last?last.checkout:t.start,checkout:t.end,conf:'',fc:'',status:'예약 필요'})}
  if(k==='vehicle')t.vehicle.push({type:arg||'',date:t.start,vendor:'',note:'',status:'예약 필요'});
  if(k==='guides')t.guides.push({name:'',city:'',from:t.start,to:t.end,status:'예약 필요',fee:'',feeDate:'',cash:'',memo:''});
  if(k==='ktx')t.ktx.push({date:t.start,route:'',time:'',seats:t.pax?t.pax+'석':'',conf:'',status:'예약 필요'});
  if(k==='flights')t.flights.push({date:t.start,route:'',flight:'',conf:'',status:'예약 필요'});
  if(k==='items')t.invoice.items.push({desc:'',usd:''});
  persist();renderDetail();refresh();
}
detail.addEventListener('click',e=>{
  const add=e.target.closest('[data-add]');if(add){addRow(add.dataset.add);return}
  const del=e.target.closest('[data-del]');
  if(del){
    const t=cur();const [k,i]=[del.dataset.del.replace(/\.\d+$/,''),+del.dataset.del.match(/\d+$/)[0]];
    getP(t,k).splice(i,1);persist();renderDetail();refresh();return;
  }
  if(e.target.id==='btn-resync'){
    const b=e.target;
    if(b.dataset.armed){
      resync(cur());return;
    }
    b.dataset.armed='1';b.textContent='지금 입력한 예약 내용이 덮어써집니다. 한 번 더 누르면 실행';
    setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='수배 탭에서 다시 가져오기'}},4000);
  }
});
function openTour(id){state.sel=id;renderDetail();refresh();document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})}
const dashEl=document.getElementById('dash');
dashEl.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openTour(b.dataset.open)});
dashEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=e.target.closest('[data-open]');if(b)openTour(b.dataset.open)}});
const listEl=document.getElementById('list');
listEl.addEventListener('click',e=>{const r=e.target.closest('tr[data-open]');if(r)openTour(r.dataset.open)});
listEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest('tr[data-open]');if(r)openTour(r.dataset.open)}});
document.getElementById('btn-reload').addEventListener('click',()=>{
  if(dirty.size||saving){smsg('저장 중인 내용이 있어 잠시 뒤에 다시 눌러 주세요.',true);return}
  load();
});

/* ---------- 불러오기 ---------- */
function showGate(msg){
  document.getElementById('gate').style.display='block';
  document.getElementById('gate-msg').textContent=msg||'';
  ['dash','listcard','detail'].forEach(id=>{document.getElementById(id).style.display='none'});
}
function hideGate(){
  document.getElementById('gate').style.display='none';
  document.getElementById('dash').style.display='';document.getElementById('listcard').style.display='';document.getElementById('detail').style.display='';
}
async function load(){
  KEY=sessGet();
  if(!KEY){showGate('이 브라우저에 직원 로그인 기록이 없습니다.');return}
  smsg('불러오는 중…');
  try{
    const d=await api('/api/admin/ops');
    const keep=state.sel;
    state.tours=(d.rows||[]).map(fromRow);
    /* 환율은 투어마다 발행일별로 저장되어 있으므로, 같은 날짜의 환율을 다른 투어에도 미리 채워 줍니다 */
    state.rates={};
    state.tours.forEach(t=>{if(t._rateDate&&t.invoice.rate!=null)state.rates[t._rateDate]=t.invoice.rate});
    state.tours.forEach(t=>{if(t.invoice.date&&t.invoice.rate==null){const rf=rateFor(t.invoice.date);if(rf)t.invoice.rate=rf.rate}});
    state.sel=state.tours.find(t=>t.id===keep)?keep:(visible()[0]||{}).id||'';
    hideGate();renderDetail();refresh();smsg('');
    loadDetails();
  }catch(e){
    if(e.status===401||e.status===503)showGate(e.status===401?'로그인이 만료되었거나 비밀번호가 맞지 않습니다.':'서버에 관리자 비밀번호가 설정되어 있지 않습니다.');
    else if(e.status===404)showGate('서버에 운영 기능이 아직 반영되지 않았습니다. (hakeem-wix-site를 push하고 Wix에서 게시해야 합니다.)');
    else smsg('불러오기 실패: '+e.message,true);
  }
}
load();
</script>
