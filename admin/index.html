function hkFetch(path, method, body, key) {
  return fetch(HK_API, { method: 'POST', headers: { 'content-type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ path, method: method || 'GET', key: key || '', body }) });
}

const KERR = e => e.status === 401 ? '비밀번호 오류.' : e.status === 503 ? 'Wix에 ADMIN_PASSWORD 미설정.' : '불러오기 실패. 잠시 후 다시 시도.';

async function api(path, opts = {}) {

  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || 'Error ' + r.status), { status: r.status });

}

// ---- ① land fee quotation and ② hotels, stored on the request as r.workflow
const CITY = { seoul: '서울', jeju: '제주', busan: '부산' }, CITY_EN = { seoul: 'Seoul', jeju: 'Jeju', busan: 'Busan' };
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const COUNTRY_DEFAULT = { India: 'IND' };
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const nightsBetween = (a, b) => a && b ? Math.round((new Date(b) - new Date(a)) / 864e5) : 0;
const koDate = iso => { if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일(${'일월화수목금토'[d.getDay()]})`; };
const enDate = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const money = n => 'US$ ' + Math.round(n).toLocaleString('en-US');

// city stays from "Seoul 4N · Jeju 3N · Busan 3N" and the arrival date
function stays(r) {
  const out = []; let d = r.trip.arrival;
  for (const m of r.trip.cities.matchAll(/(Seoul|Jeju|Busan) (\d+)N/g)) {
    const city = m[1].toLowerCase(), n = +m[2];
    out.push({ city, nights: n, checkIn: d || '', checkOut: d ? addDays(d, n) : '' });
    if (d) d = addDays(d, n);
  }
  return out;
}
function defaultWorkflow(r) {
  return {
    land: { perPerson: r.price.perPerson, pax: r.options.pax, note: '', sentAt: '' },
    country: r.options.country || COUNTRY_DEFAULT[r.options.market] || '',
    hotels: stays(r).map(s => ({ city: s.city, name: '', manager: '', email: '', checkIn: s.checkIn, checkOut: s.checkOut,
      rooms: (r.rooms && r.rooms.length ? r.rooms : [{ type: 'TWN', qty: Math.ceil(headsR(r) / 2) }]).map(x => ({ type: x.type, qty: x.qty, net: 0, rate: 0 })), breakfast: true, status: 'todo', offer: true })),
    hotelNote: '', hotelSentAt: '', hotelFx: (r.cost && r.cost.fx) || 1250, hotelMarkup: 0,
  };
}
let wf = null;
// rooms per hotel = a list of room types: [{type, qty, net (KRW per room-night), rate (USD selling price per room-night)}]
function normHotel(h) {
  if (!Array.isArray(h.rooms)) h.rooms = [{ type: h.roomType || 'TWN', qty: +h.rooms || 0, net: +h.net || 0, rate: +h.rate || 0 }];
  delete h.roomType; delete h.net; delete h.rate; return h;
}
const roomsKo = h => h.rooms.filter(r => r.qty > 0).map(r => `${r.type} ${r.qty}실`).join(', ') || '-';
const roomsEn = h => h.rooms.filter(r => r.qty > 0).map(r => `${r.qty} x ${r.type}`).join(', ') || '-';
const roomCount = h => h.rooms.reduce((a, r) => a + (+r.qty || 0), 0);
const hotelSum = h => { const n = nightsBetween(h.checkIn, h.checkOut); return h.rooms.reduce((a, r) => a + (+r.rate || 0) * (+r.qty || 0) * n, 0); };
const hotelNet = h => { const n = nightsBetween(h.checkIn, h.checkOut); return h.rooms.reduce((a, r) => a + (+r.net || 0) * (+r.qty || 0) * n, 0); };
// selling rate per room-night (USD) from the hotel's net rate (KRW): exchange rate + hotel markup, rounded up to a dollar
const sellRate = net => { const fx = +wf.hotelFx || 1250; return Math.ceil(net / fx * (1 + (+wf.hotelMarkup || 0) / 100)); };
function hotelLine(h) {
  const n = nightsBetween(h.checkIn, h.checkOut), tot = hotelSum(h), net = hotelNet(h);
  return `호텔 합계 ${roomCount(h)}실 × ${n}박${tot ? ` = ${money(tot)}` : ''}${net ? ` (원가 ₩${Math.round(net).toLocaleString('ko-KR')})` : ''}`;
}
const roomLine = (r, n) => `${(+r.rate || 0) * (+r.qty || 0) * n ? money(r.rate * r.qty * n) : ''}`;
function hotelTotals() {
  const pax = +wf.land.pax || 1;
  const offered = wf.hotels.filter(h => h.offer && h.status !== 'no' && hotelSum(h) > 0);
  const total = offered.reduce((a, h) => a + hotelSum(h), 0);
  return { offered, total, pp: total / pax, landTotal: wf.land.perPerson * pax };
}

}

const OLD_PLAN = { drv: ['staria', 'staria', 0], sol: ['solati', 'solati', 1], mix: ['solati', 'bus', 1], bus: ['bus', 'bus', 0] };
function planOf(r) {
  if (r.options.plan) return r.options.plan;
  const p = r.options.pax, c = r.options.cls || (p <= 4 ? 'drv' : p <= 9 ? 'sol' : p <= 13 ? 'mix' : 'bus'), x = OLD_PLAN[c] || OLD_PLAN.bus;

const isMix = r => r.options.vehicle === 'Standard' && planOf(r).pickup !== planOf(r).tour;

const headsR = r => (r.options.pax | 0) + (r.options.foc | 0);

function vehicleSchedule(r) {
  const out = [], mix = isMix(r), lugOn = hasLuggage(r), last = r.itinerary.length - 1;

  if (!DIR || !DIR.hotelRates || !checkIn || !checkOut || !star) return null;

  for (let d = checkIn; d < checkOut; d = addDays(d, 1)) {
    const wd = new Date(d + 'T00:00:00Z').getUTCDay(), day = wd === 5 || wd === 6 ? '주말' : '주중';

  orig.hidden = true; orig.tabIndex = -1; orig.after(wrap);

  const fill = (k, d) => { d.slice(0, N - k).split('').forEach((c, j) => { boxes[k + j].value = c; }); boxes[Math.min(N - 1, k + d.length)].focus(); sync(); };
  boxes.forEach((b, k) => {
    b.addEventListener('input', () => { const d = b.value.replace(/\D/g, ''); if (d.length > 1) return fill(k, d); b.value = d; if (d && k < N - 1) boxes[k + 1].focus(); sync(); });
    b.addEventListener('paste', e => { const d = ((e.clipboardData && e.clipboardData.getData('text')) || '').replace(/\D/g, ''); if (!d) return; e.preventDefault(); fill(k, d); });
    b.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !b.value && k) { e.preventDefault(); boxes[k - 1].value = ''; boxes[k - 1].focus(); sync(); }
      else if (e.key === 'ArrowLeft' && k) boxes[k - 1].focus();
      else if (e.key === 'ArrowRight' && k < N - 1) boxes[k + 1].focus();
      else if (e.key === 'Enter' && orig.id === 'l-pin') $('l-go').click();
    });
    b.addEventListener('focus', () => b.select());
  });
});
// staff accounts: everyone sees the list; only the master password switches accounts on or off
async function openStaffs() {
  let d; try { d = await api('/api/admin/staffs'); } catch (e) { $('staffs').innerHTML = `<div class="card">${KERR(e)}</div>`; return; }
  const m = d.me && d.me.master;
  $('staffs').innerHTML = `<div class="card"><h3>직원 계정</h3><p class="hint">@hakeemtravel.com 이메일로 로그인 화면의 '가입'에서 직접 만듭니다 (메일 인증코드 + PIN 4자리). PIN 5번 틀리면 15분 잠김. ${m ? '사용 중지하면 그 직원은 바로 로그아웃됩니다.' : '사용 중지·재사용은 관리자 비밀번호로 들어왔을 때만 바꿀 수 있습니다.'}</p>
    <table><tr><th>이름</th><th>이메일</th><th>가입</th><th>최근 로그인</th><th>사용</th></tr>${d.staff.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${fmtT(x.createdAt)}</td><td>${x.lastLogin ? fmtT(x.lastLogin) : '–'}</td><td><label class="hint"><input type="checkbox" data-sact="${esc(x.email)}"${x.active ? ' checked' : ''}${m ? '' : ' disabled'}> ${x.active ? '사용 중' : '중지'}</label></td></tr>`).join('') || '<tr><td colspan="5" class="empty">아직 가입한 직원이 없습니다.</td></tr>'}</table></div>`;
}
$('staffs').addEventListener('change', async e => {
  const em = e.target.dataset.sact; if (!em) return;
  try { await api('/api/admin/staffs', { method: 'POST', body: JSON.stringify({ staff: [{ email: em, active: e.target.checked }] }) }); openStaffs(); } catch (err) { e.target.checked = !e.target.checked; const h = $('staffs').querySelector('p.hint'); if (h) h.textContent = KERR(err); }
});
$('logout').onclick = () => { key = ''; try { sessionStorage.removeItem('hk-admin'); } catch {} location.reload(); };
$('reload').onclick = load;
$('q').oninput = draw; $('fst').onchange = draw; $('fas').onchange = draw; $('csv').onclick = exportCSV;
$('das').onchange = async () => { const v = $('das').value; try { await api('/api/admin/status?id=' + encodeURIComponent(current.id), { method: 'POST', body: JSON.stringify({ assignee: v }) }); current.assignee = v; const row = rows.find(x => x.id === current.id); if (row) row.assignee = v; } catch (e) { $('das').value = current.assignee || ''; } };
$('rows').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) open(tr.dataset.id).catch(err => { $('count').textContent = KERR(err); }); };
$('back').onclick = () => { $('detail').style.display = 'none'; showTab('list'); load(); };
$('dst').onchange = async () => { const v = $('dst').value; try { await api('/api/admin/status?id=' + encodeURIComponent(current.id), { method: 'POST', body: JSON.stringify({ status: v }) }); current.status = v; const row = rows.find(x => x.id === current.id); if (row) row.status = v; } catch (e) { $('dst').value = current.status; return; } if (v === 'booked' && wf && !wf.invoice) issueInvoice(true).catch(e => { if ($('i-msg')) $('i-msg').textContent = '인보이스 자동 발급 실패: ' + KERR(e); }); };
if (key) load();
