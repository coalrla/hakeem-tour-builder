/* ---- work-tool look (11-24): one type scale, quiet buttons, white cards, chips instead of checkboxes */
:root { --paper: #f6f6f8; --line: #e4e4ea; --ink: #1c1d22; --muted: #6b6f7a; --brand: #5b3d91; --brand-soft: #f1ecf9; --r: 10px; }

.linkbtn { text-decoration: none !important; color: var(--brand) !important; font-weight: 600; font-size: .82rem; }

input:not([type=checkbox]):not([type=radio]), select, textarea { border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-size: .88rem; }

function hotelFigs(h) {
  const n = nightsBetween(h.checkIn, h.checkOut), tot = hotelSum(h), net = hotelNet(h), pax = +wf.land.pax || 1;
  if (!tot || !n) return `<div class="hf-empty">${n ? 'Net (₩)을 넣으면 Per pax / night · Per pax total · Total이 계산됩니다' : 'Check-in · Check-out 날짜를 넣으면 계산됩니다'}</div>`;
  const kr = v => '₩' + Math.round(v).toLocaleString('ko-KR');
  return `<div class="hf"><span>Per pax / night</span><b>${money(Math.ceil(tot / pax / n))}</b><em>Net ${kr(net / pax / n)}</em></div>
    <div class="hf"><span>Per pax total</span><b>${money(Math.ceil(tot / pax))}</b><em>${n}N · Net ${kr(net / pax)}</em></div>
    <div class="hf tot"><span>Total</span><b>${money(tot)}</b><em>${roomCount(h)} rooms × ${n}N · ${pax} pax · Net ${kr(net)}</em></div>`;
}
function hotelLine(h) {
  const n = nightsBetween(h.checkIn, h.checkOut), tot = hotelSum(h), net = hotelNet(h);
  return `Hotel total ${roomCount(h)} rooms × ${n}N${tot ? ` = ${money(tot)}` : ''}${net ? ` (Net ₩${Math.round(net).toLocaleString('ko-KR')})` : ''}`;
}
const roomLine = (r, n) => `${(+r.rate || 0) * (+r.qty || 0) * n ? money(r.rate * r.qty * n) : ''}`;
function hotelTotals() {
  const pax = +wf.land.pax || 1;
  const offered = wf.hotels.filter(h => h.offer && h.status !== 'no' && hotelSum(h) > 0);
  const total = offered.reduce((a, h) => a + hotelSum(h), 0);
  return { offered, total, pp: total / pax, landTotal: wf.land.perPerson * pax };
}

  const body = { workflow: wf }; if (status) body.status = status;
  const d = await api('/api/admin/save?id=' + encodeURIComponent(current.id), { method: 'POST', body: JSON.stringify(body) });
  current.workflow = d.workflow; current.status = d.status; wf = JSON.parse(JSON.stringify(d.workflow)); $('dst').value = d.status;
  drawWorkflow(); $('w-saved').textContent = msg || '저장 완료';
  if (typeof bFrom !== 'undefined' && bFrom && bFrom === current.id && bHotelDirty) { bHotelDirty = false; await bSaveToRequest(); }
}

  try { lgMsg('보내는 중…', true); await staffCall('code', { email: lgMail('u-email'), name: lgVal('u-name') }); lgMsg(`${lgMail('u-email')}로 인증코드를 보냈습니다. 15분 안에 입력하세요.`, true); $('u-code').nextElementSibling.querySelector('input').focus(); } catch (e) { lgMsg(e.message); }
};
$('u-go').onclick = async () => {
  if (!/^\d{4}$/.test(lgVal('u-pin'))) return lgMsg('PIN은 숫자 4자리로 정하세요.');
  if (lgVal('u-pin') !== lgVal('u-pin2')) return lgMsg('PIN 두 칸이 다릅니다.');
  try { lgMsg('가입 중…', true); staffIn(await staffCall('signup', { email: lgMail('u-email'), name: lgVal('u-name'), code: lgVal('u-code'), pin: lgVal('u-pin') })); } catch (e) { lgMsg(e.message); }
};
$('r-send').onclick = async () => {
  try { lgMsg('보내는 중…', true); await staffCall('code', { email: lgMail('r-email'), purpose: 'reset' }); lgMsg('가입된 이메일이면 인증코드가 갑니다. 메일함을 확인하세요.', true); $('r-code').nextElementSibling.querySelector('input').focus(); } catch (e) { lgMsg(e.message); }
};
$('r-go').onclick = async () => {
  if (!/^\d{4}$/.test(lgVal('r-pin'))) return lgMsg('새 PIN은 숫자 4자리로 정하세요.');
  try { lgMsg('저장 중…', true); staffIn(await staffCall('reset', { email: lgMail('r-email'), code: lgVal('r-code'), pin: lgVal('r-pin') })); } catch (e) { lgMsg(e.message); }
};
['l-email', 'u-email', 'r-email'].forEach(id => $(id).addEventListener('input', e => { if (e.target.value.includes('@')) e.target.value = e.target.value.replace(/@.*$/, ''); }));
// PIN in four boxes, email code in six: one digit each, moving on as you type; the hidden original field keeps the value
document.querySelectorAll('#login input.pin4, #login input.code6').forEach(orig => {
  const N = orig.classList.contains('code6') ? 6 : 4, pin = N === 4;
  const wrap = document.createElement('div'); wrap.className = 'pin-boxes';
  const boxes = Array.from({ length: N }, (_, k) => { const b = document.createElement('input'); b.type = pin ? 'password' : 'text'; b.inputMode = 'numeric'; b.autocomplete = k ? 'off' : orig.autocomplete; b.setAttribute('aria-label', `${pin ? 'PIN' : '인증코드'} ${k + 1}번째 숫자`); wrap.appendChild(b); return b; });
  orig.hidden = true; orig.tabIndex = -1; orig.after(wrap);
  const sync = () => { orig.value = boxes.map(b => b.value).join(''); };
  const fill = (k, d) => { d.slice(0, N - k).split('').forEach((c, j) => { boxes[k + j].value = c; }); boxes[Math.min(N - 1, k + d.length)].focus(); sync(); };
  boxes.forEach((b, k) => {
    b.addEventListener('input', () => { const d = b.value.replace(/\D/g, ''); if (d.length > 1) return fill(k, d); b.value = d; if (d && k < N - 1) boxes[k + 1].focus(); sync(); });
    b.addEventListener('paste', e => { const d = ((e.clipboardData && e.clipboardData.getData('text')) || '').replace(/\D/g, ''); if (!d) return; e.preventDefault(); fill(k, d); });
    b.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !b.value && k) { e.preventDefault(); boxes[k - 1].value = ''; boxes[k - 1].focus(); sync(); }
      else if (e.key === 'ArrowLeft' && k) boxes[k - 1].focus();
      else if (e.key === 'ArrowRight' && k < N - 1) boxes[k + 1].focus();
      else if (e.key === 'Enter' && orig.id === 'l-pin') $('l-go').click();
    });
    b.addEventListener('focus', () => b.select());
  });
});
// staff accounts: everyone sees the list; only the master password switches accounts on or off
async function openStaffs() {
  let d; try { d = await api('/api/admin/staffs'); } catch (e) { $('staffs').innerHTML = `<div class="card">${KERR(e)}</div>`; return; }
  const m = d.me && d.me.master;
  $('staffs').innerHTML = `<div class="card"><h3>직원 계정</h3><p class="hint">@hakeemtravel.com 이메일로 로그인 화면의 '가입'에서 직접 만듭니다 (메일 인증코드 + PIN 4자리). PIN 5번 틀리면 15분 잠김. ${m ? '사용 중지하면 그 직원은 바로 로그아웃됩니다.' : '사용 중지·재사용은 관리자 비밀번호로 들어왔을 때만 바꿀 수 있습니다.'}</p>
    <table><tr><th>이름</th><th>이메일</th><th>가입</th><th>최근 로그인</th><th>사용</th></tr>${d.staff.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${fmtT(x.createdAt)}</td><td>${x.lastLogin ? fmtT(x.lastLogin) : '–'}</td><td><label class="hint"><input type="checkbox" data-sact="${esc(x.email)}"${x.active ? ' checked' : ''}${m ? '' : ' disabled'}> ${x.active ? '사용 중' : '중지'}</label></td></tr>`).join('') || '<tr><td colspan="5" class="empty">아직 가입한 직원이 없습니다.</td></tr>'}</table></div>`;
}
$('staffs').addEventListener('change', async e => {
  const em = e.target.dataset.sact; if (!em) return;
  try { await api('/api/admin/staffs', { method: 'POST', body: JSON.stringify({ staff: [{ email: em, active: e.target.checked }] }) }); openStaffs(); } catch (err) { e.target.checked = !e.target.checked; const h = $('staffs').querySelector('p.hint'); if (h) h.textContent = KERR(err); }
});
$('logout').onclick = () => { key = ''; try { sessionStorage.removeItem('hk-admin'); } catch {} location.reload(); };
$('reload').onclick = load;
$('q').oninput = draw; $('fst').onchange = draw; $('fas').onchange = draw; $('csv').onclick = exportCSV;
$('das').onchange = async () => { const v = $('das').value; try { await api('/api/admin/status?id=' + encodeURIComponent(current.id), { method: 'POST', body: JSON.stringify({ assignee: v }) }); current.assignee = v; const row = rows.find(x => x.id === current.id); if (row) row.assignee = v; } catch (e) { $('das').value = current.assignee || ''; } };
$('rows').onclick = async e => {
  const d = e.target.closest('[data-rdel],[data-rrestore]');
  if (d) { e.stopPropagation(); if (await delReq(d.dataset.rdel || d.dataset.rrestore, d, !!d.dataset.rrestore)) draw(); return; }
  const tr = e.target.closest('tr[data-id]'); if (tr) open(tr.dataset.id).catch(err => { $('count').textContent = KERR(err); }); };
// delete from the work screen header: same rule as the list button, then back to the list
$('wk-del').onclick = async () => { const b = $('wk-del'); if (!current) return; if (await delReq(current.id, b)) $('back').click(); };
$('back').onclick = () => { $('detail').style.display = 'none'; showTab('list'); load(); };
$('dst').onchange = async () => { const v = $('dst').value; try { await api('/api/admin/status?id=' + encodeURIComponent(current.id), { method: 'POST', body: JSON.stringify({ status: v }) }); current.status = v; const row = rows.find(x => x.id === current.id); if (row) row.status = v; } catch (e) { $('dst').value = current.status; return; } if (v === 'booked' && wf && !wf.invoice) issueInvoice(true).catch(e => { if ($('i-msg')) $('i-msg').textContent = '인보이스 자동 발급 실패: ' + KERR(e); }); };
if (key) load();
</script>
