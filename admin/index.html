<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>견적 요청 관리 · 하킴트래블코리아</title>
<link rel="icon" type="image/png" href="../favicon.png">
<style>
@font-face { font-family: "ZEN SERIF"; src: url(../fonts/zen-serif.otf) format("opentype"); font-display: swap; }
@font-face { font-family: "SUIT Variable"; font-weight: 100 900; font-display: swap; src: url(../fonts/suit-latin.woff2) format("woff2-variations"); }
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-display: swap; src: url(../fonts/pretendard-ko.woff2) format("woff2-variations"); }
:root { --ink: #14243b; --muted: #5f6b7a; --paper: #f3f5f4; --card: #fff; --line: #dce3e1; --brand: #5b3d91; --brand-soft: #efe9f8; --gold: #9a6b12; --gold-soft: #f7efdc; --ok: #0c6b60; --ok-soft: #e2f0ed; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: "SUIT Variable", "Pretendard Variable", "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--paper); }
header { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
header img.logo { height: 44px; }
header h1 { font-family: "ZEN SERIF", "Pretendard Variable", Georgia, serif; font-weight: 400; font-size: 1.5rem; margin: 0; }
header .sp { flex: 1; }
.tabs { display: flex; gap: 4px; margin-left: 12px; }
.tab { font: inherit; font-weight: 600; font-size: .92rem; border: 0; background: none; color: var(--muted); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
.tab.on { background: var(--brand-soft); color: var(--brand); }
#rates .card { margin-bottom: 14px; }
#rates h3 { margin: 0 0 4px; font-size: 1rem; }
#rates .rgrid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
#rates label { display: grid; gap: 3px; font-size: .78rem; color: var(--muted); font-weight: 600; }
#rates input { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font: inherit; font-size: .9rem; width: 130px; text-align: right; color: var(--ink); }
#rates input.chg { border-color: var(--gold); background: var(--gold-soft); }
#rates .def { font-weight: 400; font-size: .72rem; color: var(--muted); }
#rates table { width: 100%; border-collapse: collapse; margin-top: 8px; }
#rates td, #rates th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; font-size: .86rem; }
#rates td input { width: 120px; }
#rates .rbar { position: sticky; bottom: 0; background: var(--paper); padding: 10px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#rates textarea { width: 100%; min-height: 60px; border: 1px solid var(--line); border-radius: 7px; padding: 8px; font: inherit; }
button, select, input { font: inherit; }
.btn { border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--brand); }
main { max-width: 1280px; margin: 0 auto; padding: 20px 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
#login { max-width: 360px; margin: 80px auto; display: grid; gap: 10px; }
#login input { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.err { color: #b3261e; font-size: .9rem; min-height: 1.2em; }
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.bar input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 240px; }
.bar select { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff; }
.count { color: var(--muted); font-size: .9rem; margin-left: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--brand-soft); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.st { white-space: nowrap; display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.st.new { background: var(--brand); color: #fff; } .st.quoted { background: var(--gold-soft); color: var(--gold); }
.st.land, .st.hotel { background: var(--gold-soft); color: var(--gold); } .st.hotel { background: #e6eef8; color: #3c639b; }
.st.booked { background: var(--ok-soft); color: var(--ok); } .st.closed { background: #eceff1; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px; }
/* detail */
#detail { display: none; }
.dtop { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.sheet { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
.sheet h2 { font-family: "ZEN SERIF", "Pretendard Variable", Georgia, serif; font-weight: 400; font-size: 1.8rem; margin: 0 0 4px; }
.sub { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 24px; margin: 20px 0; }
.grid div b { display: block; font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-bottom: 2px; }
.price { font-family: "ZEN SERIF", "Pretendard Variable", Georgia, serif; font-size: 2rem; color: var(--gold); }
.day { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); break-inside: avoid; }
.day .n { font-family: "ZEN SERIF", "Pretendard Variable", Georgia, serif; font-size: 1.6rem; line-height: 1; }
.day h4 { margin: 0; font-size: 1rem; }
.day .rt { color: var(--muted); font-size: .8rem; }
.day ul { margin: 6px 0 0; padding-left: 18px; }
.day li.rq { color: var(--brand); font-weight: 600; }
.tag { display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; background: var(--brand); color: #fff; margin-left: 6px; vertical-align: 2px; }
.notes { white-space: pre-wrap; background: var(--paper); border-radius: 8px; padding: 10px 12px; }
/* workflow */
.wf { margin-top: 20px; }
.step { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; background: #fff; }
.step h3 { margin: 0 0 10px; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.step h3 .done { font-size: .74rem; font-weight: 700; color: var(--ok); background: var(--ok-soft); border-radius: 99px; padding: 2px 8px; }
.row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; margin-bottom: 10px; }
.row label { display: grid; gap: 3px; font-size: .78rem; color: var(--muted); font-weight: 600; }
.row input, .row select, .step textarea, .ht input, .ht select { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-size: .9rem; color: var(--ink); background: #fff; }
.step textarea { width: 100%; min-height: 54px; font: inherit; font-size: .9rem; }
.big { font-family: "ZEN SERIF", "Pretendard Variable", Georgia, serif; font-size: 1.5rem; color: var(--gold); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.ht { width: 100%; border-collapse: collapse; font-size: .85rem; margin: 6px 0; }
.ht th { font-size: .7rem; padding: 6px 4px; }
.ht td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
.ht input { width: 100%; min-width: 0; }
.ht .w-s { width: 60px; } .ht .w-m { width: 120px; }
.hotels td { padding: 10px 0 14px; border-bottom: 2px solid var(--line); }
.hotels tr:hover td, .hotels tr:hover { background: none !important; }
.hcard { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.hsec { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.hsec.sell { background: var(--gold-soft); border-color: #ead9b3; }
.hs-h { font-size: .78rem; font-weight: 700; color: var(--ink); }
.hs-h span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.hl3 { display: grid; grid-template-columns: 110px 200px 16px 170px minmax(0, 1fr); gap: 8px; align-items: end; }
.hl3 .rt { padding-bottom: 8px; font-weight: 700; font-size: .88rem; }
.hl4 { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px dashed #e2cf9f; padding-top: 8px; }
.hl4 .hsum { font-weight: 600; color: var(--ink); }
.hrooms { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hr-l { font-size: .72rem; font-weight: 600; color: var(--muted); margin-right: 2px; }
.rpill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; }
.hcard .rpill input { width: 64px; padding: 4px 6px; }
.hcard .rpill input[data-rf="qty"] { width: 52px; }
.rpill em { font-style: normal; font-size: .8rem; color: var(--muted); }
.rpill .rx { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
.hl3 .arrow { padding-bottom: 8px; color: var(--muted); text-align: center; }
.hl3 .hsum { padding-bottom: 8px; }
.hcard label { display: grid; gap: 3px; font-size: .72rem; color: var(--muted); font-weight: 600; min-width: 0; }
.hcard input, .hcard select { width: 100%; min-width: 0; }
.hl1 { display: grid; grid-template-columns: 90px minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1.6fr); gap: 8px; }
.hl2 { display: grid; grid-template-columns: 150px 150px 110px minmax(0, 1fr); gap: 8px; align-items: end; }
.hcard label.chk { display: flex; align-items: center; gap: 5px; font-size: .82rem; color: var(--ink); padding-bottom: 7px; white-space: nowrap; }
.hcard label.chk input { width: auto; }
.hbtn { display: flex; gap: 6px; padding-bottom: 3px; justify-content: flex-end; }
@media (max-width: 1000px) { .hl1, .hl2, .hl3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hl3 .arrow { display: none; } }
.ops td:nth-child(3) input { min-width: 190px; } .ops td:nth-child(4) input { min-width: 150px; } .ops td:nth-child(5) input, .ops td:nth-child(7) input { min-width: 100px; }
.ops tr.op-ok td { background: #eef8f0; } .ops tr.op-req td { background: #fff8e6; } .ops tr.op-na td { opacity: .5; }
.sum { display: flex; gap: 24px; flex-wrap: wrap; font-size: .92rem; margin-top: 8px; }
.sum b { font-family: "ZEN SERIF", "Pretendard Variable", Georgia, serif; font-size: 1.25rem; color: var(--gold); font-weight: 400; }
.hint { font-size: .8rem; color: var(--muted); }
.saved { font-size: .82rem; color: var(--ok); }
/* buyer quotation (printed) */
#qsheet { display: none; }
#qsheet .qh { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--brand); padding-bottom: 10px; margin-bottom: 16px; }
#qsheet .qh img { height: 54px; }
#qsheet h2 { font-family: "ZEN SERIF", "Pretendard Variable", Georgia, serif; font-weight: 400; margin: 0; font-size: 1.7rem; }
#qsheet table { width: 100%; border-collapse: collapse; font-size: .88rem; margin: 6px 0 14px; }
#qsheet th, #qsheet td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
#qsheet .tot td { font-weight: 700; }
#qsheet .qday { padding: 6px 0; border-bottom: 1px solid var(--line); break-inside: avoid; font-size: .88rem; }
.btn.sm { padding: 4px 9px; font-size: .8rem; }
.cost { margin: 10px 0 4px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: #fbfaff; }
.cost summary { cursor: pointer; font-weight: 600; color: var(--brand); }
.ct { width: 100%; border-collapse: collapse; font-size: .84rem; margin-top: 8px; }
.ct td, .ct th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.ct .num { text-align: right; white-space: nowrap; }
.ct tr.g th { background: #f1ecf9; font-size: .78rem; }
.ct tr.s td { font-weight: 600; }
.ct input { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: .84rem; }
.ct input.sub { margin-top: 3px; font-size: .75rem; color: var(--muted); }
.ct input.n { width: 110px; text-align: right; } .ct input.q { width: 64px; text-align: right; }
.ct td:nth-child(2), .ct td:nth-child(3), .ct td:nth-child(4) { width: 1%; }
.cost .edited { background: var(--gold-soft); color: var(--gold); font-size: .72rem; padding: 2px 7px; border-radius: 99px; margin-left: 4px; }
body.printing-quote #qsheet { display: block; }
@media print { body.printing-quote header, body.printing-quote main { display: none !important; } body.printing-quote #qsheet { display: block !important; } }
@media print { header, .dtop, #list { display: none !important; } body { background: #fff; } main { padding: 0; } .sheet { border: 0; padding: 0; } }
</style>
</head>
<body>
<header><img src="../logo.png" alt="Hakeem Travel Korea" class="logo"><h1>Quote Requests</h1><nav class="tabs" id="tabs" hidden><button class="tab on" data-tab="list">견적 요청</button><button class="tab" data-tab="rates">단가 관리</button></nav><span class="sp"></span><button class="btn ghost" id="logout" hidden>로그아웃</button></header>
<main>
  <form id="login" class="card" onsubmit="return false">
    <b>하킴 직원 전용</b>
    <input id="pw" type="password" placeholder="관리자 비밀번호" autocomplete="current-password">
    <button class="btn" id="go">열기</button>
    <div class="err" id="err"></div>
  </form>

  <section id="list" hidden>
    <div class="bar">
      <input id="q" placeholder="회사·이름·이메일 검색">
      <select id="fst"><option value="">전체 상태</option><option value="new">신규</option><option value="land">지상비 발송</option><option value="hotel">호텔 견적 발송</option><option value="booked">예약 확정</option><option value="closed">종료</option></select>
      <select id="fas"><option value="">전체 담당</option></select>
      <button class="btn ghost" id="reload">새로고침</button>
      <button class="btn ghost" id="csv">CSV 내보내기</button>
      <span class="count" id="count"></span>
    </div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th>접수 시각</th><th>회사 / 담당자</th><th>일정</th><th>도착일</th><th class="num">인원</th><th>등급 · 테마</th><th class="num">1인당</th><th class="num">총액</th><th>상태</th><th>하킴 담당</th></tr></thead>
      <tbody id="rows"></tbody></table>
    </div>
  </section>

  <section id="rates" hidden></section>

  <section id="detail">
    <div class="dtop">
      <button class="btn ghost" id="back">← 전체 목록</button>
      <span class="sp" style="flex:1"></span>
      <label>하킴 담당 <select id="das"></select></label>
      <label>상태 <select id="dst"><option value="new">신규</option><option value="land">지상비 발송</option><option value="hotel">호텔 견적 발송</option><option value="booked">예약 확정</option><option value="closed">종료</option></select></label>
      <a class="btn ghost" id="reply" href="#">이메일 답장</a>
      <button class="btn" onclick="window.print()">PDF 저장</button>
    </div>
    <div class="wf" id="wf"></div>
    <div class="sheet" id="sheet"></div>
  </section>
</main>
<div id="qsheet"></div>
<script>
const HK_API = 'https://www.hakeemtravel.com/_functions/hk';
// every server call goes to one Wix endpoint as a plain-text POST (no CORS preflight)
function hkFetch(path, method, body, key) {
  return fetch(HK_API, { method: 'POST', headers: { 'content-type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ path, method: method || 'GET', key: key || '', body }) });
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const usd = n => 'US$ ' + Number(n).toLocaleString('en-US');
const fmt = iso => iso ? new Date(iso.length === 10 ? iso + 'T00:00:00' : iso).toLocaleDateString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' }) : '–';
const fmtT = iso => new Date(iso).toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const THEME = { classic: '클래식', family: '가족', romantic: '커플', beauty: 'K-뷰티', wellness: '웰니스', tech: '테크', education: '교육' };
const STATUS = { new: '신규', land: '지상비 발송', quoted: '지상비 발송', hotel: '호텔 견적 발송', booked: '예약 확정', closed: '종료' };
const SEASON = { spring: '봄', summer: '여름', autumn: '가을', winter: '겨울' };
const MARKET = { 'Middle East': '중동', 'India': '인도', 'Other markets': '기타' };
const nd = s => String(s).replace(/(\d+)N(\d+)D/, '$1박 $2일').replace(/ (\d+)N/g, ' $1박').replace(/Seoul/g, '서울').replace(/Jeju/g, '제주').replace(/Busan/g, '부산');
const KERR = e => e.status === 401 ? '비밀번호 오류.' : e.status === 503 ? 'Wix에 ADMIN_PASSWORD 미설정.' : '불러오기 실패. 잠시 후 다시 시도.';
let key = '', rows = [], current = null, staff = [], settings = null;
try { key = sessionStorage.getItem('hk-admin') || ''; } catch {}

async function api(path, opts = {}) {
  const r = await hkFetch(path, opts.method || 'GET', opts.body ? JSON.parse(opts.body) : undefined, key);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || 'Error ' + r.status), { status: r.status });
  return d;
}
async function load() {
  try {
    rows = (await api('/api/admin/list')).rows;
    try { settings = await api('/api/admin/settings'); staff = settings.staff || []; } catch {}
    $('login').hidden = true; $('list').hidden = false; $('logout').hidden = false; $('tabs').hidden = false; $('err').textContent = '';
    try { sessionStorage.setItem('hk-admin', key); } catch {}
    fillStaff(); draw();
  } catch (e) {
    $('login').hidden = false; $('list').hidden = true; $('err').textContent = key ? KERR(e) : '';
    try { sessionStorage.removeItem('hk-admin'); } catch {}
  }
}
function filtered() {
  const q = $('q').value.trim().toLowerCase(), f = $('fst').value, a = $('fas').value;
  return rows.filter(r => (!f || r.status === f) && (!a || (a === '-' ? !r.assignee : r.assignee === a)) && (!q || [r.company, r.name, r.email].join(' ').toLowerCase().includes(q)));
}
function fillStaff() {
  const names = [...new Set([...staff, ...rows.map(r => r.assignee).filter(Boolean)])];
  const cur = $('fas').value;
  $('fas').innerHTML = '<option value="">전체 담당</option><option value="-">미지정</option>' + names.map(n => `<option>${esc(n)}</option>`).join('');
  $('fas').value = names.includes(cur) || cur === '-' ? cur : '';
  $('das').innerHTML = '<option value="">미지정</option>' + names.map(n => `<option>${esc(n)}</option>`).join('');
}
// CSV of the rows shown (filters applied); UTF-8 with BOM so Excel reads Korean correctly
function exportCSV() {
  const head = ['요청번호', '접수 시각', '상태', '하킴 담당', '회사', '바이어 담당자', '이메일', '일정', '도착일', '출발일', '인원', '국적', '등급', '테마', '호텔 등급', '식사', '1인당(USD)', '총액(USD)'];
  const cell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const body = filtered().map(r => [r.id, new Date(r.createdAt).toLocaleString('ko-KR'), STATUS[r.status] || r.status, r.assignee, r.company, r.name, r.email, nd(r.trip), r.arrival, r.departure, r.pax, r.guests, r.tier, THEME[r.theme] || r.theme, r.hotel, r.meals, r.perPerson, r.total]);
  const csv = '\ufeff' + [head, ...body].map(x => x.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `hakeem-quote-requests-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function draw() {
  const list = filtered(), f = $('fst').value;
  $('count').textContent = `전체 ${rows.length}건 중 ${list.length}건 · 신규 ${rows.filter(r => r.status === 'new').length}건`;

const CITY = { seoul: '서울', jeju: '제주', busan: '부산' }, CITY_EN = { seoul: 'Seoul', jeju: 'Jeju', busan: 'Busan' };
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const COUNTRY_DEFAULT = { India: 'IND' };
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

const enDate = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const money = n => 'US$ ' + Math.round(n).toLocaleString('en-US');

// city stays from "Seoul 4N · Jeju 3N · Busan 3N" and the arrival date
function stays(r) {
  const out = []; let d = r.trip.arrival;
  for (const m of r.trip.cities.matchAll(/(Seoul|Jeju|Busan) (\d+)N/g)) {
    const city = m[1].toLowerCase(), n = +m[2];
    out.push({ city, nights: n, checkIn: d || '', checkOut: d ? addDays(d, n) : '' });
    if (d) d = addDays(d, n);

}
function defaultWorkflow(r) {

    land: { perPerson: r.price.perPerson, pax: r.options.pax, note: '', sentAt: '' },
    country: r.options.country || COUNTRY_DEFAULT[r.options.market] || '',
    hotels: stays(r).map(s => ({ city: s.city, name: '', manager: '', email: '', checkIn: s.checkIn, checkOut: s.checkOut,
      rooms: (r.rooms && r.rooms.length ? r.rooms : [{ type: 'TWN', qty: Math.ceil(r.options.pax / 2) }]).map(x => ({ type: x.type, qty: x.qty, net: 0, rate: 0 })), breakfast: true, status: 'todo', offer: true })),
    hotelNote: '', hotelSentAt: '', hotelFx: (r.cost && r.cost.fx) || 1250, hotelMarkup: 0,

function normHotel(h) {
  if (!Array.isArray(h.rooms)) h.rooms = [{ type: h.roomType || 'TWN', qty: +h.rooms || 0, net: +h.net || 0, rate: +h.rate || 0 }];
  delete h.roomType; delete h.net; delete h.rate; return h;
}
const roomsKo = h => h.rooms.filter(r => r.qty > 0).map(r => `${r.type} ${r.qty}실`).join(', ') || '-';
const roomsEn = h => h.rooms.filter(r => r.qty > 0).map(r => `${r.qty} x ${r.type}`).join(', ') || '-';
const roomCount = h => h.rooms.reduce((a, r) => a + (+r.qty || 0), 0);
const hotelSum = h => { const n = nightsBetween(h.checkIn, h.checkOut); return h.rooms.reduce((a, r) => a + (+r.rate || 0) * (+r.qty || 0) * n, 0); };
const hotelNet = h => { const n = nightsBetween(h.checkIn, h.checkOut); return h.rooms.reduce((a, r) => a + (+r.net || 0) * (+r.qty || 0) * n, 0); };
// selling rate per room-night (USD) from the hotel's net rate (KRW): exchange rate + hotel markup, rounded up to a dollar
const sellRate = net => { const fx = +wf.hotelFx || 1250; return Math.ceil(net / fx * (1 + (+wf.hotelMarkup || 0) / 100)); };
function hotelLine(h) {
  const n = nightsBetween(h.checkIn, h.checkOut), tot = hotelSum(h), net = hotelNet(h);

    ${D.slabs.map((s, i) => `<tr><td>${SLAB_NAME[i] || ''}</td>${['margin', 'transfer', 'day', 'guide', 'luggage'].map(k => `<td><label>${rIn(['slabs', i, k], k === 'margin' ? '$' : '₩')}</label></td>`).join('')}</tr>`).join('')}</table></div>
  <div class="card"><h3>식사 · 교통</h3><div class="sub">식사는 1인 1회, 항공·KTX는 1인 편도</div>
    <div class="rgrid"><label>점심${rIn(['meals', 'lunch'])}</label><label>저녁${rIn(['meals', 'dinner'])}</label><label>국내선 항공${rIn(['tickets', 'flight'])}</label><label>KTX 일반실${rIn(['tickets', 'ktx'])}</label><label>KTX 특실${rIn(['tickets', 'ktx1st'])}</label></div></div>
  <div class="card"><h3>입장료 <span class="sub">1인 기준 · 수정 ${nChg}곳</span></h3>
    <input id="r-q" placeholder="관광지 검색" value="${esc(rq)}" style="width:260px;text-align:left;margin-top:8px">
    <table>${sights.map(k => `<tr><td>${esc(names[k])}</td><td><label>${rIn(['sights', k])}</label></td></tr>`).join('') || '<tr><td>검색 결과 없음</td></tr>'}</table></div>
  <div class="card"><h3>직원 목록</h3><div class="sub">견적 요청의 '하킴 담당'에서 고를 이름. 한 줄에 한 명</div>
    <textarea id="r-staff">${esc(staff.join('\n'))}</textarea></div>
  <div class="rbar"><button class="btn" id="r-save">저장</button><button class="btn ghost" id="r-reset">전체 기본값으로</button><span class="saved" id="r-msg">${settings.rates && settings.rates.updatedAt ? '마지막 저장 ' + fmtT(settings.rates.updatedAt) : '저장된 변경 없음 (기본 단가 사용 중)'}</span></div>
  <p class="sub">저장하면 이후 견적(사이트 가격·새 요청·원가표)에 바로 적용. 이미 들어온 요청의 사이트 계산가는 그대로이고, 원가표는 현재 단가로 다시 계산됨. 차량 업그레이드(럭셔리) 요금은 여기서 수정 불가.</p>`;
}
$('rates').addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'r-q') { const pos = el.selectionStart; drawRates(); const q = $('r-q'); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (!el.dataset.rp) return;
  const path = el.dataset.rp.split('.').map(k => /^\d+$/.test(k) ? +k : k), d = dVal(path);
  let o = rDraft; for (let i = 0; i < path.length - 1; i++) { const k = path[i]; if (o[k] == null) o[k] = typeof path[i + 1] === 'number' ? [] : {}; o = o[k]; }
  const last = path.at(-1);
  if (el.value === '' || +el.value === d) delete o[last]; else o[last] = +el.value;
  el.classList.toggle('chg', o[last] !== undefined); $('r-msg').textContent = '저장 안 됨';
});
$('rates').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'r-save' || (b.id === 'r-reset' && Date.now() - rResetArmed < 4000)) {
    const body = { rates: b.id === 'r-reset' ? {} : rDraft, staff: $('r-staff').value.split('\n').map(s => s.trim()).filter(Boolean) };
    try { settings = await api('/api/admin/settings', { method: 'POST', body: JSON.stringify(body) }); staff = settings.staff || []; rDraft = JSON.parse(JSON.stringify(settings.rates || {})); drawRates(); $('r-msg').textContent = b.id === 'r-reset' ? '기본값으로 되돌림' : '저장 완료 · 이후 견적에 적용'; fillStaff(); }
    catch (err) { $('r-msg').textContent = KERR(err); }
    return;
  }
  if (b.id === 'r-reset') { rResetArmed = Date.now(); b.textContent = '한 번 더 누르면 모든 수정 삭제'; }
});
document.querySelectorAll('.tab').forEach(b => b.onclick = () => showTab(b.dataset.tab));
$('go').onclick = () => { key = $('pw').value; load(); };
$('logout').onclick = () => { key = ''; try { sessionStorage.removeItem('hk-admin'); } catch {} location.reload(); };
$('reload').onclick = load;
$('q').oninput = draw; $('fst').onchange = draw; $('fas').onchange = draw; $('csv').onclick = exportCSV;
$('das').onchange = async () => { const v = $('das').value; try { await api('/api/admin/status?id=' + encodeURIComponent(current.id), { method: 'POST', body: JSON.stringify({ assignee: v }) }); current.assignee = v; const row = rows.find(x => x.id === current.id); if (row) row.assignee = v; } catch (e) { $('das').value = current.assignee || ''; } };
$('rows').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) open(tr.dataset.id).catch(err => { $('count').textContent = KERR(err); }); };
$('back').onclick = () => { $('detail').style.display = 'none'; showTab('list'); load(); };
$('dst').onchange = async () => { try { await api('/api/admin/status?id=' + encodeURIComponent(current.id), { method: 'POST', body: JSON.stringify({ status: $('dst').value }) }); current.status = $('dst').value; } catch (e) { $('dst').value = current.status; } };
if (key) load();
</script>
</body>
</html>
