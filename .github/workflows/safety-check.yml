# Checks every push and pull request of the public repo (2026-11-24):
# no costs, margins, rates or vendor contacts in public files, and no preview-only lines.
name: Safety check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No preview-only line
        run: |
          if grep -n "window.HK_PREVIEW = true" index.html admin/*.html; then echo "::error::Remove the window.HK_PREVIEW = true line before publishing"; exit 1; fi
      - name: No server-only data in public files
        run: |
          bad=0
          # tariffs, rate tables and vendor directory live only in hakeem-wix-site
          for pat in "icnEn:" "LIMO = {" "RATE_DEFAULTS" "DIRECTORY = " "INV_BANK" "ADMIN_PASSWORD ="; do
            if grep -n -- "$pat" index.html admin/*.html; then echo "::error::Server-only data found: $pat"; bad=1; fi
          done
          # phone numbers other than the company's own
          if grep -nE "01[016789]-?[0-9]{3,4}-?[0-9]{4}" index.html admin/*.html | grep -v "5426.7112"; then echo "::error::Personal phone number found"; bad=1; fi
          exit $bad
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Page scripts parse
        run: |
          cat > /tmp/parse.mjs <<'JS'
          import fs from 'node:fs';
          let bad = 0;
          for (const f of process.argv.slice(2)) {
            const html = fs.readFileSync(f, 'utf8');
            [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)].forEach((m, i) => {
              try { new Function(m[1]); } catch (e) { console.log(`::error file=${f}::script ${i + 1}: ${e.message}`); bad = 1; }
            });
          }
          process.exit(bad);
          JS
          node /tmp/parse.mjs index.html admin/*.html
